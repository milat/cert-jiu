<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gerador de certificados</title>
  <link rel="stylesheet" href="style.css">
  <script src="assets/modelo.js" defer></script>
  <script src="assets/yellowtail.js" defer></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">RUBENS FILHO · JIU-JITSU</p><h1>Gerador de certificados</h1></header>
    <div class="layout">
      <section id="dados" class="panel" aria-labelledby="dados-titulo">
        <h2 id="dados-titulo">Dados da graduação</h2>
        <form id="formulario">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" autocomplete="name" placeholder="Nome completo do aluno" maxlength="100" required>
          <label for="faixa">Faixa</label>
          <select id="faixa" name="faixa" required>
            <option value="" disabled selected>Selecione a faixa</option>
            <option value="Branca">Branca</option>
            <option value="Azul">Azul</option>
            <option value="Roxa">Roxa</option>
            <option value="Marrom">Marrom</option>
            <option value="Preta">Preta</option>
            <optgroup label="Infantil">
              <option value="Cinza e Branca">Cinza e Branca</option>
              <option value="Cinza">Cinza</option>
              <option value="Cinza e Preta">Cinza e Preta</option>
              <option value="Amarela e Branca">Amarela e Branca</option>
              <option value="Amarela">Amarela</option>
              <option value="Amarela e Preta">Amarela e Preta</option>
              <option value="Laranja e Branca">Laranja e Branca</option>
              <option value="Laranja">Laranja</option>
              <option value="Laranja e Preta">Laranja e Preta</option>
              <option value="Verde e Branca">Verde e Branca</option>
              <option value="Verde">Verde</option>
              <option value="Verde e Preta">Verde e Preta</option>
            </optgroup>
          </select>
          <label for="grau">Grau</label>
          <select id="grau" name="grau"><option value="0">Sem grau</option><option value="1">1º grau</option><option value="2">2º grau</option><option value="3">3º grau</option><option value="4">4º grau</option></select>
          <label for="local">Local</label>
          <input id="local" name="local" placeholder="Ex.: Guarulhos, SP" value="Guarulhos" maxlength="100" required>
          <label for="data">Data</label>
          <input id="data" name="data" type="date" required>
          <button id="gerar" type="submit" disabled>Gerar</button>
        </form>
      </section>
      <section id="previa" class="panel preview" aria-labelledby="previa-titulo" hidden>
        <div class="preview-header"><h2 id="previa-titulo" tabindex="-1">Prévia do certificado</h2><a id="baixar" class="download" hidden>Baixar PNG</a></div>
        <canvas id="certificado" role="img" aria-label="Modelo do certificado sem preenchimento"></canvas>
        <button id="gerar-novamente" type="button">Gerar novamente</button>
      </section>
    </div>
    <p id="status" role="status" aria-live="polite">Carregando modelo…</p>
  </main>
</body>
</html>
